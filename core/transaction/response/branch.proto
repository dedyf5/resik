syntax = "proto3";

package response;
option go_package = "github.com/dedyf5/resik/core/transaction/response";

message BranchOmzet {
    string organization_name = 1; // @gotags: json:"organization_name" example:"Resik Organization"
    string branch_name = 2; // @gotags: json:"branch_name" example:"Resik Branch"
    double omzet = 3; // @gotags: json:"omzet" example:"5000.5"
    string period = 4; // @gotags: json:"period" example:"2023-11-22"
}
