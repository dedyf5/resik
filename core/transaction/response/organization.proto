syntax = "proto3";

package response;
option go_package = "github.com/dedyf5/resik/core/transaction/response";

import "core/transaction/response/common.proto";

// Message response for organization omzet transaction.
message OrganizationOmzet {
    Organization organization = 1; // @gotags: json:"organization"
    double omzet = 2; // @gotags: json:"omzet" example:"5000.5"
    string period = 3; // @gotags: json:"period" example:"2023-11-22"
}
