syntax = "proto3";

package core.common;
option go_package = "github.com/dedyf5/resik/core/common";

// Message for common user
message User {
    string id = 1; // @gotags: json:"id" example:"01a0d3979d5e7ab99b47d88a5f9349bd"
    string name = 2; // @gotags: json:"name" example:"User 1"
    string username = 3; // @gotags: json:"username" example:"user1"
}
