syntax = "proto3";

package transaction;
option go_package = "github.com/dedyf5/resik/app/grpc/handler/transaction";

import "app/grpc/proto/status/status.proto";
import "core/transaction/response/detail.proto";

// Message response detail for transaction
message TransactionDetailRes {
  status.Status status = 1; // @gotags: json:"status"
  core.transaction.response.TransactionDetail data = 2; // @gotags: json:"data"
}