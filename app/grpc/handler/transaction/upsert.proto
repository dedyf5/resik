syntax = "proto3";

package transaction;
option go_package = "github.com/dedyf5/resik/app/grpc/handler/transaction";

import "app/grpc/proto/status/status.proto";
import "core/common/id.proto";

// TransactionUpsertRes is the response for transaction insert and update
message TransactionUpsertRes {
  status.Status status = 1; // @gotags: json:"status"
  core.common.Id data = 2; // @gotags: json:"data"
}
