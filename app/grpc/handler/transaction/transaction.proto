syntax = "proto3";

package transaction;
option go_package = "github.com/dedyf5/resik/app/grpc/handler/transaction";

import "app/grpc/handler/transaction/organization.proto";
import "app/grpc/handler/transaction/branch.proto";
import "core/transaction/request/organization.proto";
import "core/transaction/request/branch.proto";

service TransactionService {
    rpc OrganizationOmzetGet(request.OrganizationOmzetGet) returns (transaction.OrganizationOmzetGetRes);
    rpc BranchOmzetGet(request.BranchOmzetGet) returns (transaction.BranchOmzetGetRes);
}
