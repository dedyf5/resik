syntax = "proto3";

package organization;
option go_package = "github.com/dedyf5/resik/app/grpc/handler/organization";

import "core/common/status.proto";
import "core/organization/response/list.proto";
import "pkg/response/response_meta.proto";

message OrganizationListGetRes {
    core.common.Status status = 1; // @gotags: json:"status"
    repeated core.organization.response.OrganizationList data = 2; // @gotags: json:"data"
    response.ResponseMeta meta = 3; // @gotags: json:"meta"
}
