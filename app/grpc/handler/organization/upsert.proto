syntax = "proto3";

package organization;
option go_package = "github.com/dedyf5/resik/app/grpc/handler/organization";

import "app/grpc/proto/status/status.proto";
import "core/organization/response/upsert.proto";

message OrganizationUpsertRes {
    status.Status status = 1; // @gotags: json:"status"
    response.OrganizationUpsert data = 2; // @gotags: json:"data"
}
